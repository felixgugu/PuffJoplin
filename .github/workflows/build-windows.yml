name: Build Windows portable app

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test Go backend
        run: |
          go test ./...
          go vet ./...

      - name: Test and build frontend
        working-directory: frontend
        run: npm run build

      - name: Build portable executable
        run: wails build -platform windows/amd64 -tags desktop,production

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item build/bin/PuffJoplin.exe portable/PuffJoplin.exe
          Compress-Archive -Path portable/PuffJoplin.exe -DestinationPath PuffJoplin-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PuffJoplin-win-x64
          path: PuffJoplin-win-x64.zip
          if-no-files-found: error
