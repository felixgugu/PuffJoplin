name: Feature request
description: Suggest an improvement for PuffJoplin
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Desktop UI
        - Search and organization
        - Import
        - Export and PDF
        - Managed Markdown directory
        - Performance
        - Other
    validations:
      required: true
